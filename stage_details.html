<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chi tiết báo cáo chặng học tập trong hành trình chuyển đổi số của Đồng Huyền Linh.">
  <title>Đồng Huyền Linh | Chi Tiết Chặng Báo Cáo</title>
  
  <!-- 🎋 CSS Design System & Components -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/sections.css">
  
  <style>
    /* Special layout rules for details page */
    body.stage-details-page {
      background: linear-gradient(to bottom, rgba(249, 249, 246, 0.88) 0%, rgba(249, 249, 246, 0.88) 100%), 
                  url('./PortfolioAssets/HanhTrinh.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      margin: 0;
      padding: 40px var(--space-md);
      overflow-x: hidden;
    }

    .details-layout-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-xl);
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* Sidebar Styling */
    .details-sidebar {
      position: sticky;
      top: 40px;
      height: fit-content;
      background: rgba(255, 255, 255, 0.94);
      padding: var(--space-lg);
    }

    .sidebar-header h4 {
      color: var(--accent-vermillion);
      margin-bottom: var(--space-md);
      font-size: 1.15rem;
      border-bottom: 2px solid var(--accent-gold);
      padding-bottom: var(--space-xs);
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-link {
      display: block;
      padding: 10px 14px;
      border-radius: 4px;
      color: var(--text-charcoal);
      font-size: 0.95rem;
      transition: all var(--transition-normal);
      text-decoration: none;
      border: 1px solid transparent;
    }

    .sidebar-link:hover {
      background-color: rgba(184, 144, 71, 0.05);
      color: var(--accent-gold-light);
      border-color: rgba(184, 144, 71, 0.15);
      transform: translateX(4px);
    }

    .sidebar-link.active {
      background-color: var(--accent-vermillion);
      color: var(--text-paper) !important;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(139, 0, 0, 0.15);
    }

    /* Main Parchment Sheet Styling */
    .parchment-sheet {
      background: rgba(253, 252, 249, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px 50px;
      min-height: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    /* Scoped document content target setup */
    #stage-detail-content-target {
      width: 100%;
    }

    /* 📜 Scoped traditional Chinese scholar styles for dynamic report document */
    .stage-document-wrapper {
      font-family: var(--font-serif);
      color: var(--text-charcoal);
      line-height: 1.85;
      font-size: 1.02rem;
    }

    /* Override body font and layout */
    .stage-document-wrapper .document-container {
      background: transparent !important;
      padding: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* Scoped Headings */
    .stage-document-wrapper h1 {
      font-family: var(--font-serif) !important;
      color: var(--accent-vermillion) !important;
      text-align: center !important;
      margin-bottom: 2.2rem !important;
      font-size: 1.65rem !important;
      text-transform: uppercase !important;
      border-bottom: 2px solid var(--accent-gold) !important;
      padding-bottom: 14px !important;
      letter-spacing: 0.5px !important;
    }

    .stage-document-wrapper h2 {
      font-family: var(--font-serif) !important;
      color: var(--accent-gold) !important;
      font-size: 1.25rem !important;
      font-weight: bold !important;
      margin-top: 2.2rem !important;
      margin-bottom: 1rem !important;
      border-bottom: 1px dashed var(--border-gold) !important;
      padding-bottom: 6px !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
    }

    .stage-document-wrapper h2::before {
      content: "🎋" !important;
      font-size: 1rem !important;
      filter: sepia(0.5) hue-rotate(10deg);
    }

    .stage-document-wrapper h3 {
      font-family: var(--font-serif) !important;
      color: var(--text-ink) !important;
      font-size: 1.15rem !important;
      font-weight: bold !important;
      margin-top: 1.8rem !important;
      margin-bottom: 0.8rem !important;
    }

    .stage-document-wrapper h4 {
      font-family: var(--font-serif) !important;
      color: var(--accent-vermillion) !important;
      font-size: 1.05rem !important;
      font-weight: bold !important;
      margin-top: 1.4rem !important;
      margin-bottom: 0.6rem !important;
    }

    /* Paragraphs and Lists */
    .stage-document-wrapper p {
      font-size: 1.02rem !important;
      line-height: 1.85 !important;
      text-align: justify !important;
      text-indent: 2rem !important;
      margin-bottom: 1.4rem !important;
      color: var(--text-charcoal) !important;
    }

    .stage-document-wrapper ul, .stage-document-wrapper ol {
      margin-bottom: 1.4rem !important;
      padding-left: 2rem !important;
    }

    .stage-document-wrapper li {
      font-size: 1.02rem !important;
      line-height: 1.75 !important;
      margin-bottom: 0.6rem !important;
      color: var(--text-charcoal) !important;
    }

    /* Image Group Containers */
    .stage-document-wrapper .image-group {
      display: flex !important;
      gap: var(--space-md) !important;
      justify-content: center !important;
      flex-wrap: wrap !important;
      margin: 1.8rem 0 !important;
    }

    .stage-document-wrapper .image-container {
      flex: 1 !important;
      min-width: 260px !important;
      text-align: center !important;
      padding: 12px !important;
      background: var(--bg-paper-warm) !important;
      border: 1px solid var(--border-ink) !important;
      border-radius: 6px !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02) !important;
    }

    .stage-document-wrapper .image-container img {
      max-width: 100% !important;
      height: auto !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      border-radius: 4px !important;
    }

    .stage-document-wrapper .image-caption {
      font-family: var(--font-serif) !important;
      font-size: 0.8rem !important;
      color: var(--text-muted) !important;
      margin-top: 6px !important;
      font-style: italic !important;
    }

    .stage-document-wrapper .image-note {
      font-family: var(--font-serif) !important;
      font-size: 0.8rem !important;
      color: var(--accent-vermillion) !important;
      margin-top: 4px !important;
      text-align: center !important;
    }

    /* Prompt Box and Terminal style */
    .stage-document-wrapper .prompt-box, 
    .stage-document-wrapper .prompt-card {
      background: rgba(35, 32, 26, 0.98) !important;
      color: #f8f8f2 !important;
      border: 1px solid var(--accent-gold) !important;
      border-left: 4px solid var(--accent-vermillion) !important;
      border-radius: 6px !important;
      padding: 1.2rem 1.5rem !important;
      margin: 1.6rem 0 !important;
      font-family: 'Courier New', Courier, monospace !important;
      font-size: 0.95rem !important;
      line-height: 1.6 !important;
      position: relative !important;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08) !important;
    }

    .stage-document-wrapper .prompt-box::after, 
    .stage-document-wrapper .prompt-card::after {
      content: "PROMPT INPUT" !important;
      position: absolute !important;
      top: 6px !important;
      right: 12px !important;
      font-size: 0.65rem !important;
      color: var(--accent-gold) !important;
      font-family: var(--font-sans) !important;
      font-weight: bold !important;
      letter-spacing: 1px !important;
    }

    .stage-document-wrapper .prompt-box code,
    .stage-document-wrapper .prompt-card code {
      font-family: 'Courier New', Courier, monospace !important;
      color: #ffaf00 !important;
      background: transparent !important;
      padding: 0 !important;
    }

    /* Tables styling */
    .stage-document-wrapper table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 2rem 0 !important;
      font-size: 0.9rem !important;
      border: 1px solid var(--border-ink) !important;
      background: rgba(253, 252, 249, 0.5) !important;
    }

    .stage-document-wrapper th {
      background: rgba(184, 144, 71, 0.08) !important;
      color: var(--accent-vermillion) !important;
      font-weight: bold !important;
      padding: 12px !important;
      border: 1px solid var(--border-ink) !important;
      font-family: var(--font-serif) !important;
      text-align: left !important;
    }

    .stage-document-wrapper td {
      padding: 10px 12px !important;
      border: 1px solid var(--border-ink) !important;
      color: var(--text-charcoal) !important;
    }

    .stage-document-wrapper tr:nth-child(even) {
      background: rgba(249, 249, 246, 0.6) !important;
    }

    /* Rating Badges in Stage 2 */
    .stage-document-wrapper .rating-badge {
      display: inline-block !important;
      padding: 2px 8px !important;
      border-radius: 4px !important;
      font-weight: bold !important;
      color: #fff !important;
      font-size: 0.8rem !important;
      font-family: var(--font-sans) !important;
    }

    .stage-document-wrapper .rating-5 { background-color: var(--accent-vermillion) !important; }
    .stage-document-wrapper .rating-4 { background-color: var(--accent-gold) !important; }
    .stage-document-wrapper .rating-3 { background-color: #9c7b4c !important; }
    .stage-document-wrapper .rating-2 { background-color: #6e6e6e !important; }
    .stage-document-wrapper .rating-1 { background-color: #3a3a3a !important; }

    /* Page breaks styled as gradient dividers with diamonds */
    .stage-document-wrapper .page-break-indicator {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 12px !important;
      color: var(--accent-gold) !important;
      font-size: 0.8rem !important;
      font-family: var(--font-serif) !important;
      margin: 3.5rem 0 2rem 0 !important;
      font-style: italic !important;
      border: none !important;
      padding: 0 !important;
      background: transparent !important;
    }

    .stage-document-wrapper .page-break-indicator::before,
    .stage-document-wrapper .page-break-indicator::after {
      content: "" !important;
      display: inline-block !important;
      width: 120px !important;
      height: 1px !important;
      background: linear-gradient(to right, transparent, var(--accent-gold), transparent) !important;
    }

    /* Ethics Grid in Stage 6 */
    .stage-document-wrapper .ethics-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: var(--space-md) !important;
      margin: 2rem 0 !important;
    }

    .stage-document-wrapper .ethics-col {
      padding: 1.2rem !important;
      border-radius: 6px !important;
      background: var(--bg-paper-warm) !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02) !important;
    }

    .stage-document-wrapper .ethics-col.do {
      border: 1px solid rgba(139, 0, 0, 0.15) !important;
      border-top: 4px solid var(--accent-vermillion) !important;
    }

    .stage-document-wrapper .ethics-col.dont {
      border: 1px solid rgba(28, 28, 28, 0.15) !important;
      border-top: 4px solid var(--text-ink) !important;
    }

    .stage-document-wrapper .ethics-col h3 {
      font-family: var(--font-serif) !important;
      margin-top: 0 !important;
      margin-bottom: 1rem !important;
      font-size: 1.15rem !important;
    }

    .stage-document-wrapper .ethics-col.do h3 {
      color: var(--accent-vermillion) !important;
    }

    .stage-document-wrapper .ethics-col.dont h3 {
      color: var(--text-ink) !important;
    }

    .stage-document-wrapper .ethics-list {
      list-style-type: none !important;
      padding-left: 0 !important;
    }

    .stage-document-wrapper .ethics-item {
      position: relative !important;
      padding-left: 1.5rem !important;
      margin-bottom: 0.8rem !important;
      font-size: 0.95rem !important;
    }

    .stage-document-wrapper .ethics-col.do .ethics-item::before {
      content: "✓" !important;
      position: absolute !important;
      left: 0 !important;
      color: var(--accent-vermillion) !important;
      font-weight: bold !important;
    }

    .stage-document-wrapper .ethics-col.dont .ethics-item::before {
      content: "✗" !important;
      position: absolute !important;
      left: 0 !important;
      color: var(--text-ink) !important;
      font-weight: bold !important;
    }

    /* Comparison Grid in Stage 5 */
    .stage-document-wrapper .compare-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: var(--space-md) !important;
      margin: 2rem 0 !important;
    }

    .stage-document-wrapper .compare-col {
      padding: 1.2rem !important;
      border-radius: 6px !important;
      background: var(--bg-paper-warm) !important;
      border: 1px solid var(--border-ink) !important;
    }

    .stage-document-wrapper .compare-col.traditional {
      border-top: 4px solid var(--accent-gold) !important;
    }

    .stage-document-wrapper .compare-col.ai {
      border-top: 4px solid var(--accent-vermillion) !important;
    }

    .stage-document-wrapper .compare-col h4 {
      font-family: var(--font-serif) !important;
      margin-top: 0 !important;
      margin-bottom: 0.8rem !important;
      font-size: 1.1rem !important;
    }

    .stage-document-wrapper .compare-col.traditional h4 {
      color: var(--accent-gold) !important;
    }

    .stage-document-wrapper .compare-col.ai h4 {
      color: var(--accent-vermillion) !important;
    }

    /* Solutions / Box outlines in Stage 6 */
    .stage-document-wrapper .solution-box {
      border: 1px solid var(--border-ink) !important;
      background-color: var(--bg-paper-warm) !important;
      border-left: 4px solid var(--accent-gold) !important;
      padding: 1.2rem !important;
      border-radius: 4px !important;
      margin: 1.5rem 0 !important;
    }

    .stage-document-wrapper .solution-box h4 {
      margin-top: 0 !important;
      color: var(--accent-gold) !important;
    }

    /* Flow blocks in Stage 5 */
    .stage-document-wrapper .flow-container {
      background: var(--bg-paper-warm) !important;
      border: 1px solid var(--border-ink) !important;
      border-radius: 6px !important;
      padding: 1.5rem !important;
      margin: 2rem 0 !important;
    }

    .stage-document-wrapper .flow-title {
      font-family: var(--font-serif) !important;
      color: var(--accent-vermillion) !important;
      font-size: 1.15rem !important;
      font-weight: bold !important;
      margin-top: 0 !important;
      margin-bottom: 1.2rem !important;
      text-align: center !important;
    }

    .stage-document-wrapper .flow-steps {
      display: flex !important;
      align-items: center !important;
      justify-content: space-around !important;
      flex-wrap: wrap !important;
      gap: 10px !important;
    }

    .stage-document-wrapper .flow-step {
      padding: 10px 14px !important;
      background: var(--bg-paper) !important;
      border: 1px solid var(--accent-gold) !important;
      border-radius: 4px !important;
      font-family: var(--font-serif) !important;
      font-weight: bold !important;
      font-size: 0.9rem !important;
      color: var(--text-ink) !important;
      text-align: center !important;
    }

    .stage-document-wrapper .flow-arrow {
      color: var(--accent-gold) !important;
      font-weight: bold !important;
      font-size: 1.2rem !important;
    }

    /* ethics quote block */
    .stage-document-wrapper .ethics-quote {
      font-family: var(--font-serif) !important;
      font-style: italic !important;
      border-left: 4px solid var(--accent-gold) !important;
      padding-left: 1rem !important;
      margin: 1.5rem 0 !important;
      color: var(--text-muted) !important;
    }

    /* Responsive grid columns */
    @media (max-width: 768px) {
      .stage-document-wrapper .ethics-grid,
      .stage-document-wrapper .compare-grid {
        grid-template-columns: 1fr !important;
      }
      .stage-document-wrapper .flow-steps {
        flex-direction: column !important;
      }
      .stage-document-wrapper .flow-arrow {
        transform: rotate(90deg) !important;
        margin: 5px 0 !important;
      }
    }

    /* Responsive Layout for Mobile Devices */
    @media (max-width: 992px) {
      .details-layout-container {
        grid-template-columns: 1fr;
      }
      .details-sidebar {
        position: relative;
        top: 0;
        margin-bottom: var(--space-md);
        width: 100%;
        box-sizing: border-box;
      }
      .sidebar-menu {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .sidebar-link {
        padding: 8px 14px;
        font-size: 0.88rem;
      }
      .parchment-sheet {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body class="stage-details-page">

  <!-- 🖌️ Ambient Canvas Background -->
  <canvas id="ambient-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></canvas>

  <div class="details-layout-container">
    <!-- Sidebar Navigation -->
    <aside class="details-sidebar card card-classical">
      <div class="sidebar-header">
        <h4 class="text-serif">目錄 / Mục lục</h4>
      </div>
      <ul class="sidebar-menu">
        <li><a href="?stage=1" data-stage-link="1" class="sidebar-link text-serif">書卷壹 • Chặng 1</a></li>
        <li><a href="?stage=2" data-stage-link="2" class="sidebar-link text-serif">書卷貳 • Chặng 2</a></li>
        <li><a href="?stage=3" data-stage-link="3" class="sidebar-link text-serif">書卷叁 • Chặng 3</a></li>
        <li><a href="?stage=4" data-stage-link="4" class="sidebar-link text-serif">書卷肆 • Chặng 4</a></li>
        <li><a href="?stage=5" data-stage-link="5" class="sidebar-link text-serif">書卷伍 • Chặng 5</a></li>
        <li><a href="?stage=6" data-stage-link="6" class="sidebar-link text-serif">書卷陸 • Chặng 6</a></li>
      </ul>
      
      <div style="margin-top: 2rem; border-top: 1px dashed var(--border-ink); padding-top: 1.5rem;">
        <a href="index.html#HanhTrinh" id="btn-back-to-timeline" class="btn btn-secondary btn-sm" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0.6rem 1rem; text-decoration: none; border-radius: 4px;">
          <span>↩️</span> Quay lại hành trình
        </a>
      </div>
    </aside>

    <!-- Main Content parchment sheet -->
    <main class="details-main-content">
      <article class="parchment-sheet card card-classical">
        <div id="stage-detail-content-target">
          <!-- Dynamically loaded content goes here -->
          <div style="text-align: center; padding: 100px 0; color: var(--text-muted); font-style: italic; font-family: var(--font-serif);">
            Đang mở thư quyển...
          </div>
        </div>
      </article>
    </main>
  </div>

  <!-- ==========================================================================
       LIGHTBOX CONTAINER
       ========================================================================== -->
  <div id="lightbox-modal" class="lightbox-modal">
    <div class="lightbox-content">
      <button id="lightbox-close" class="lightbox-close" aria-label="Close Lightbox">&times;</button>
      <button id="lightbox-prev" class="lightbox-arrow lightbox-prev" aria-label="Previous Image">&#10094;</button>
      <img id="lightbox-img" class="lightbox-img" src="" alt="">
      <button id="lightbox-next" class="lightbox-arrow lightbox-next" aria-label="Next Image">&#10095;</button>
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- ==========================================================================
       SCRIPTS
       ========================================================================== -->
  <!-- Ambient Canvas custom rendering (vết mực loang, lá trúc, chim bay, mây trôi) -->
  <script src="./js/ambient-canvas.js"></script>
  
  <!-- Database containing stage reports as formatted HTML string templates -->
  <script src="./js/stage-content.js"></script>
  <script src="./js/lightbox.js"></script>
  <script src="./js/custom-cursor.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 0. Sync Brush Toggle State
      const brushEnabled = localStorage.getItem("brushEnabled") !== "false";
      if (!brushEnabled) {
        document.body.classList.add("brush-disabled");
      }

      // 1. Function to load content dynamically
      function loadStage(stageNum, pushState = true) {
        if (stageNum < 1 || stageNum > 6) stageNum = 1;
        
        // Update active class in sidebar links
        document.querySelectorAll(".sidebar-link").forEach(link => {
          link.classList.remove("active");
          if (link.getAttribute("data-stage-link") === String(stageNum)) {
            link.classList.add("active");
          }
        });

        // Update back button (Redirect to index with parameter & hash)
        const backBtn = document.getElementById("btn-back-to-timeline");
        if (backBtn) {
          backBtn.setAttribute("href", `index.html?stage=${stageNum}#HanhTrinh`);
        }


        // Inject content
        const contentTarget = document.getElementById("stage-detail-content-target");
        if (contentTarget && typeof window.stageContents !== "undefined") {
          const reportHtml = window.stageContents[`stage${stageNum}`];
          if (reportHtml) {
            contentTarget.style.opacity = "0";
            contentTarget.style.transform = "translateY(12px)";
            contentTarget.style.transition = "none";
            
            // Force layout reflow
            contentTarget.offsetHeight;
            
            contentTarget.innerHTML = reportHtml;
            
            // Fade-in & slide-up animation
            contentTarget.style.transition = "opacity 0.4s ease, transform 0.4s ease";
            contentTarget.style.opacity = "1";
            contentTarget.style.transform = "translateY(0)";
          } else {
            contentTarget.innerHTML = `
              <div style="text-align:center; padding:50px; font-family:var(--font-serif); color:var(--accent-vermillion);">
                Không tìm thấy nội dung báo cáo cho Chặng ${stageNum}.
              </div>`;
          }
        }

        // Push state to browser history
        if (pushState) {
          window.history.pushState({ stage: stageNum }, "", `?stage=${stageNum}`);
        }

        // Scroll back to top smoothly
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // 2. Parse initial stage from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      let initialStage = parseInt(urlParams.get("stage")) || 1;
      loadStage(initialStage, false);

      // 3. Handle click on sidebar links to transition client-side
      document.querySelector(".sidebar-menu").addEventListener("click", (e) => {
        const link = e.target.closest(".sidebar-link");
        if (link) {
          e.preventDefault();
          const targetStage = parseInt(link.getAttribute("data-stage-link"));
          loadStage(targetStage, true);
        }
      });

      // 4. Handle popstate event (back/forward browser buttons)
      window.addEventListener("popstate", (e) => {
        const urlParams = new URLSearchParams(window.location.search);
        let stageNum = parseInt(urlParams.get("stage")) || 1;
        loadStage(stageNum, false);
      });
    });
  </script>
</body>
</html>
